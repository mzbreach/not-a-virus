name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  metadata:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $versionNode = Select-Xml -Path "src/NotAVirus/NotAVirus.csproj" -XPath "/Project/PropertyGroup/Version" | Select-Object -First 1
          if ($null -eq $versionNode -or [string]::IsNullOrWhiteSpace($versionNode.Node.InnerText)) {
            Write-Error "Missing <Version> in src/NotAVirus/NotAVirus.csproj."
            exit 1
          }

          $version = $versionNode.Node.InnerText.Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $expectedTag = "v${{ steps.version.outputs.version }}"
          $actualTag = "${{ github.ref_name }}"

          if ($actualTag -ne $expectedTag) {
            Write-Error "Release tag '$actualTag' does not match src/NotAVirus/NotAVirus.csproj <Version> '${{ steps.version.outputs.version }}'. Push tag '$expectedTag' or update <Version>."
            exit 1
          }

  publish:
    name: Publish ${{ matrix.rid }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore not-a-virus.sln

      - name: Build
        run: dotnet build not-a-virus.sln -c Release --no-restore

      - name: Publish ${{ matrix.rid }}
        run: dotnet publish src/NotAVirus -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o artifacts/${{ matrix.rid }}

      - name: Package ${{ matrix.rid }} archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release-assets
          archive="not-a-virus-${{ matrix.rid }}-v${{ needs.metadata.outputs.version }}.zip"
          (cd artifacts/${{ matrix.rid }} && zip -r "../../release-assets/$archive" .)

      - name: Package ${{ matrix.rid }} archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $archive = "release-assets/not-a-virus-${{ matrix.rid }}-v${{ needs.metadata.outputs.version }}.zip"
          if (Test-Path $archive) {
            Remove-Item $archive
          }
          Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath $archive -Force

      - name: Upload ${{ matrix.rid }} archive
        uses: actions/upload-artifact@v4
        with:
          name: not-a-virus-${{ matrix.rid }}-archive
          path: release-assets/not-a-virus-${{ matrix.rid }}-v${{ needs.metadata.outputs.version }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - metadata
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: not-a-virus-*-archive
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: |
          find release-assets -maxdepth 2 -type f -print
          ls -lah release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempts=5
            local delay=10
            local n=1

            until "$@"; do
              exit_code=$?
              if [ "$n" -ge "$attempts" ]; then
                echo "Command failed after $attempts attempts."
                return "$exit_code"
              fi

              echo "Command failed with exit code $exit_code. Retrying in ${delay}s... ($n/$attempts)"
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Reusing it."
          else
            retry gh release create "$RELEASE_TAG" \
              --title "not-a-virus v$VERSION" \
              --generate-notes \
              --verify-tag
          fi

          for asset in release-assets/*.zip; do
            echo "Uploading $asset"
            retry gh release upload "$RELEASE_TAG" "$asset" --clobber
          done